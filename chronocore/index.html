<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0c10"><title>ChronoCore</title><style>html,body{height:100%;margin:0;background:#0b0c10;color:#f4f5f7;font-family:Inter,system-ui,sans-serif}body{display:grid;place-items:center}.boot{font-size:12px;color:#8b92a0;letter-spacing:.08em}</style></head><body><div class="boot" id="boot">OPENING CHRONOCORE…</div><script>(async()=>{try{const base='https://raw.githubusercontent.com/DavidCole1/launchdone/chronocore-hosting/chronocore/';const parts=await Promise.all(Array.from({length:5},(_,i)=>fetch(base+'payload-'+(i+1)+'.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Missing app segment');return r.text()})));const raw=atob(parts.join('').trim());const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').textContent='ChronoCore could not load: '+e.message}})()</script></body></html>
